name: Build IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project and custom icon
        run: |
          python3 scripts/generate_icon.py
          xcodegen generate --spec project.yml
      - name: Test policy and calculator behavior
        run: swift test
      - name: Test real app launch and PIN flow
        timeout-minutes: 12
        run: bash scripts/test_launch.sh
      - name: Upload launch test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Launch-Test-Evidence
          path: |
            build/ui-results.xcresult
            build/ui-attachments
          retention-days: 3
          if-no-files-found: warn
      - name: Build, sign and verify IPA
        run: bash scripts/build_ipa.sh
      - name: Upload IPA and verification report
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-TrollStore
          path: dist/
          if-no-files-found: error
          retention-days: 3
      - name: Upload matching crash symbols
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Debug-Symbols
          path: build/DerivedData/Build/Products/Release-iphoneos/Calculator.app.dSYM
          if-no-files-found: error
          retention-days: 3
